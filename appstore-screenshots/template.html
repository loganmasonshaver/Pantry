<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1320px;
      height: 2868px;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse 110% 60% at 50% 0%, rgba(74,222,128,0.20), transparent 70%),
        linear-gradient(180deg, #0A0A0A 0%, #000000 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      position: relative;
    }

    body::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 300px 60px rgba(74,222,128,0.10);
      pointer-events: none;
      z-index: 2;
    }

    /* BIG headline — MyFitnessPal-style, dominates the top half */
    .copy {
      position: absolute;
      top: 160px;
      left: 100px;
      right: 100px;
      z-index: 3;
    }

    .headline {
      font-size: 168px;
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: -5px;
      color: #FFFFFF;
    }

    .headline .line {
      display: block;
    }

    .headline .accent {
      color: #4ADE80;
    }

    /* ── Realistic iPhone bezel ──
       Outer shell ≈ phone body, padding = bezel thickness, inner = screen.
       Side buttons + Dynamic Island add the "this is an actual iPhone" feel. */
    .phone-wrap {
      position: absolute;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%);
      z-index: 1;
    }

    .phone {
      width: 940px;
      padding: 18px;
      border-radius: 78px;
      background: linear-gradient(180deg, #3A3A3D 0%, #1C1C1E 100%);
      box-shadow:
        0 80px 140px rgba(0,0,0,0.65),
        0 0 0 2px rgba(255,255,255,0.08),
        inset 0 0 0 1px rgba(255,255,255,0.06);
      position: relative;
    }

    .phone-screen {
      width: 100%;
      aspect-ratio: 1320 / 2868;
      border-radius: 62px;
      overflow: hidden;
      background: #000;
      display: block;
      position: relative;
    }

    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dynamic Island — sits OVER the screen at the top center.
       Contains a subtle front-camera lens dot on the right side, matching
       the actual iPhone 16/17 Pro Max layout. */
    .dynamic-island {
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      width: 268px;
      height: 76px;
      border-radius: 38px;
      background: #000;
      z-index: 5;
    }

    .dynamic-island::after {
      content: '';
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #2A3540 0%, #0E1418 60%, #050709 100%);
      box-shadow:
        inset 0 0 4px rgba(0,0,0,0.8),
        inset 0 1px 1px rgba(80,120,160,0.3);
    }

    /* Side buttons — on the phone shell, slightly protruding.
       Positions match iPhone 16/17 Pro Max (Action btn upper-left,
       Camera Control lower-right is new on iPhone 16+). */
    .btn {
      position: absolute;
      background: linear-gradient(180deg, #3A3A3D 0%, #1C1C1E 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.5),
        0 1px 2px rgba(0,0,0,0.6);
    }
    /* Left side */
    .btn-action   { left: -5px; top:  380px; width: 7px; height:  76px; border-radius: 3px 0 0 3px; }
    .btn-vol-up   { left: -5px; top:  500px; width: 7px; height: 120px; border-radius: 3px 0 0 3px; }
    .btn-vol-down { left: -5px; top:  640px; width: 7px; height: 120px; border-radius: 3px 0 0 3px; }
    /* Right side */
    .btn-power    { right: -5px; top: 500px; width: 7px; height: 150px; border-radius: 0 3px 3px 0; }
    .btn-camera   { right: -5px; top: 720px; width: 7px; height:  88px; border-radius: 0 3px 3px 0; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="headline">
      <span class="line">{{LINE1}}</span>
      <span class="line">{{LINE2}}</span>
    </div>
  </div>

  <div class="phone-wrap" style="transform: translateX(-50%) {{TRANSFORM}}">
    <div class="phone">
      <span class="btn btn-action"></span>
      <span class="btn btn-vol-up"></span>
      <span class="btn btn-vol-down"></span>
      <span class="btn btn-power"></span>
      <span class="btn btn-camera"></span>
      <div class="phone-screen">
        <img src="{{SCREENSHOT}}" alt="">
        <div class="dynamic-island"></div>
      </div>
    </div>
  </div>
</body>
</html>
