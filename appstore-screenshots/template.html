<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1320px;
      height: 2868px;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse 110% 60% at 50% 0%, rgba(74,222,128,0.32), transparent 70%),
        linear-gradient(180deg, #131D16 0%, #080C09 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      position: relative;
    }

    body::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 320px 70px rgba(74,222,128,0.15);
      pointer-events: none;
      z-index: 2;
    }

    /* BIG headline — MyFitnessPal-style, dominates the top half */
    .copy {
      position: absolute;
      top: 160px;
      left: 100px;
      right: 100px;
      z-index: 3;
    }

    .headline {
      font-size: 168px;
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: -5px;
      color: #FFFFFF;
    }

    .headline .line {
      display: block;
    }

    .headline .accent {
      color: #4ADE80;
    }

    /* ── Realistic iPhone bezel ──
       Outer shell ≈ phone body, padding = bezel thickness, inner = screen.
       Side buttons + Dynamic Island add the "this is an actual iPhone" feel. */
    .phone-wrap {
      position: absolute;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%);
      z-index: 1;
    }

    /* Phone body — MyFitnessPal style: solid dark bezel, clean iconic
       silhouette, no metallic gradient. Subtle 1px outer rim highlight
       gives it just enough "edge" without going photorealistic. */
    .phone {
      width: 940px;
      padding: 22px;
      border-radius: 82px;
      background: #1A1A1C;
      box-shadow:
        0 80px 140px rgba(0,0,0,0.65),
        0 0 0 1.5px rgba(255,255,255,0.10);
      position: relative;
    }

    .phone-screen {
      width: 100%;
      aspect-ratio: 1320 / 2868;
      border-radius: 60px;
      overflow: hidden;
      background: #000;
      display: block;
      position: relative;
    }

    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dynamic Island — solid black pill, no camera detail. Matches the
       clean "icon" look MFP uses vs. hyper-realistic device renders. */
    .dynamic-island {
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 80px;
      border-radius: 40px;
      background: #000;
      z-index: 5;
    }

    /* Side buttons — simpler, flatter, just enough to read as buttons.
       MFP style: dark, uniform color, no metallic gradient. */
    .btn {
      position: absolute;
      background: #2A2A2C;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    /* Left side: Action button + Volume up/down (iPhone 15 Pro+ layout) */
    .btn-action   { left: -4px; top:  400px; width: 6px; height:  78px; border-radius: 3px 0 0 3px; }
    .btn-vol-up   { left: -4px; top:  520px; width: 6px; height: 125px; border-radius: 3px 0 0 3px; }
    .btn-vol-down { left: -4px; top:  670px; width: 6px; height: 125px; border-radius: 3px 0 0 3px; }
    /* Right side: Power + Camera Control (iPhone 16+ layout) */
    .btn-power    { right: -4px; top: 520px; width: 6px; height: 160px; border-radius: 0 3px 3px 0; }
    .btn-camera   { right: -4px; top: 760px; width: 6px; height:  90px; border-radius: 0 3px 3px 0; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="headline">
      <span class="line">{{LINE1}}</span>
      <span class="line">{{LINE2}}</span>
    </div>
  </div>

  <div class="phone-wrap" style="transform: translateX(-50%) {{TRANSFORM}}">
    <div class="phone">
      <span class="btn btn-action"></span>
      <span class="btn btn-vol-up"></span>
      <span class="btn btn-vol-down"></span>
      <span class="btn btn-power"></span>
      <span class="btn btn-camera"></span>
      <div class="phone-screen">
        <img src="{{SCREENSHOT}}" alt="">
        <div class="dynamic-island"></div>
      </div>
    </div>
  </div>
</body>
</html>
